services:
  synesthesia-canvas:
    image: ghcr.io/panda-995/synesthesia-canvas:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
